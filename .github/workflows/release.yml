name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds its changelog from history, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # The `before` hooks run the hermetic suite, which needs none of these --
      # but a release that ships an untested binary is not worth the minute
      # saved, so the integration tier runs first as a separate gate.
      - name: Install ripgrep and Universal Ctags
        run: sudo apt-get update && sudo apt-get install -y ripgrep universal-ctags

      - name: Test
        run: go test -tags=integration ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A PAT with contents:write on mdabydeen/homebrew-tap. Without it the
          # release still publishes; only the formula update is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
