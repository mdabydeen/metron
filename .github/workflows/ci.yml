name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # The same three binaries Dockerfile.test installs, so the integration
      # tier runs here too.
      - name: Install ripgrep and Universal Ctags
        run: sudo apt-get update && sudo apt-get install -y ripgrep universal-ctags

      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./... && go vet -tags=integration ./... && go vet -tags=live ./...

      - name: Test
        run: go test -tags=integration ./...

      - name: Race
        run: go test -tags=integration -race -count=1 ./...

      - name: Coverage
        run: |
          go test -tags=integration -covermode=count -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
